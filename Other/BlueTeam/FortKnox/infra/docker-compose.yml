services:
  postgres:
    image: postgres:16-alpine
    container_name: fortknox-postgres
    environment:
      POSTGRES_USER: fortknox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: fortknox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fortknox_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fortknox-redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  fortknox_pgdata:

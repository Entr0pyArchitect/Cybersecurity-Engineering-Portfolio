[package]
name = "fortknox-dev-client"
version = "0.1.0"
edition = "2024"

[dependencies]
fortknox-crypto = { version = "0.1.0", path = "../../crates/fortknox-crypto" }
fortknox-protocol = { version = "0.1.0", path = "../../crates/fortknox-protocol" }
futures-util = "0.3.32"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.29.0"
uuid = { version = "1.23.1", features = ["v4"] }

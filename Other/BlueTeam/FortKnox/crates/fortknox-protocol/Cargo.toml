[package]
name = "fortknox-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde", "clock"] }
fortknox-crypto = { version = "0.1.0", path = "../fortknox-crypto" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
